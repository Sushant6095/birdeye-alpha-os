app = "alphaos-ws-sidecar"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4001"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 4001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[services.tcp_checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "10s"

[[services.http_checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "get"
  path = "/healthz"
